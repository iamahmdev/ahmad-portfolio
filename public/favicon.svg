<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a14"/>
      <stop offset="100%" stop-color="#181126"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="28" fill="none" stroke="url(#strokeGrad)" stroke-width="3" stroke-opacity="0.5"/>
  
  <!-- Code Brackets < / > -->
  <path d="M 40 42 L 20 64 L 40 86" fill="none" stroke="url(#codeGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="73" y1="36" x2="55" y2="92" stroke="url(#slashGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 88 42 L 108 64 L 88 86" fill="none" stroke="url(#codeGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Green Live Status Dot -->
  <circle cx="106" cy="22" r="7" fill="#10b981"/>
</svg>

